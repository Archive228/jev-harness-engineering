name: Terminal agent

on:
  push:
    paths:
      - 'terminal-agent/**'
      - 'jev-harness-lab/judge.py'
      - '.github/workflows/terminal.yml'
  pull_request:
    paths:
      - 'terminal-agent/**'
      - 'jev-harness-lab/judge.py'
      - '.github/workflows/terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r terminal-agent/requirements.txt
      - name: Engine, process cancellation, mission and terminal pilot tests
        working-directory: terminal-agent
        run: python -B -m unittest discover -s tests -v
      - name: Reproduce the saved guided calculator with independent CLI checks
        working-directory: terminal-agent
        run: python -B verification/guided/independent/check_cli.py verification/guided/live-session/workspace --output "$RUNNER_TEMP/guided-calculator-checks"
