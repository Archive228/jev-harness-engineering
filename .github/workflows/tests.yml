name: Test harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and subprocess integration tests
        working-directory: jev-harness-lab
        run: python -B -m unittest discover -s tests -v
      - name: Offline evaluation matrix
        working-directory: jev-harness-lab
        run: python -B evaluate.py --out evaluation-ci
      - name: Verify evaluation invariants
        working-directory: jev-harness-lab
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evaluation-ci/evaluation.json').read_text())
          assert len(report['rows']) == 9
          assert all(row['remote_jev_requests'] == 0 for row in report['rows'])
          assert all(not row['false_complete'] for row in report['rows'])
          assert sum(row['status'] == 'complete' for row in report['rows']) == 6
          assert sum(row['status'] == 'stop' for row in report['rows']) == 3
          PY

  article:
    name: Reproducible article build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:article
      - name: Generated article matches source
        run: git diff --exit-code -- jev-engineering.html
