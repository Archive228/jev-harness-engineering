<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1080" viewBox="0 0 1480 1080" role="img" aria-labelledby="title desc">
<title id="title">Three Jev primitives on one message</title>
<desc id="desc">The same PDF export failure is sent to three independent questions. Choice picks a category, Score rates impact on a given scale from zero to two, Noul rates the probability that a working workaround is stated. Probability values and live API results are not shown.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#66716C"/></marker></defs>
<rect x="0" y="0" width="1480" height="1080" rx="0" fill="#FBF8F2"/>
<text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#66716C" text-anchor="start">02  /  THREE PRIMITIVES</text>
<text x="64" y="126" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#26302F" text-anchor="start">One state. Three different questions.</text>
<text x="64" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#66716C" text-anchor="start">Below: the criteria given and the answer shapes, with no invented API results.</text>
<rect x="64" y="211" width="1352" height="140" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<rect x="88" y="232" width="166" height="34" rx="17" fill="#F1F2EC"/>
<text x="171.0" y="255" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#66716C" text-anchor="middle">SHARED STATE</text>
<text x="280" y="252" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#26302F" text-anchor="start">"PDF export fails in Safari. The same document exports in Chrome.</text>
<text x="280" y="292" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#26302F" text-anchor="start">I use Chrome for now, but I want the Safari export back."</text>
<line x1="276" y1="351" x2="276" y2="396" stroke="#66716C" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="740" y1="351" x2="740" y2="396" stroke="#66716C" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="1204" y1="351" x2="1204" y2="396" stroke="#66716C" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="406" width="424" height="572" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<rect x="528" y="406" width="424" height="572" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<rect x="992" y="406" width="424" height="572" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<rect x="88" y="430" width="108" height="34" rx="17" fill="#FFF0E8"/>
<text x="142.0" y="453" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#E47254" text-anchor="middle">CHOICE</text>
<text x="88" y="505" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#26302F" text-anchor="start">Which option fits?</text>
<text x="88" y="550" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#26302F" text-anchor="start">Which category does</text>
<text x="88" y="583" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#26302F" text-anchor="start">this message belong to?</text>
<circle cx="99" cy="608" r="6" fill="#FBF8F2" stroke="#D8DCD4" stroke-width="2"/>
<text x="117" y="615" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#26302F" text-anchor="start">export  ·  Export</text>
<circle cx="99" cy="650" r="6" fill="#FBF8F2" stroke="#D8DCD4" stroke-width="2"/>
<text x="117" y="657" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#26302F" text-anchor="start">account  ·  Account</text>
<circle cx="99" cy="692" r="6" fill="#FBF8F2" stroke="#D8DCD4" stroke-width="2"/>
<text x="117" y="699" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#26302F" text-anchor="start">payment  ·  Payment</text>
<circle cx="99" cy="734" r="6" fill="#FBF8F2" stroke="#D8DCD4" stroke-width="2"/>
<text x="117" y="741" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#26302F" text-anchor="start">other  ·  Other</text>
<line x1="88" y1="773" x2="464" y2="773" stroke="#D8DCD4" stroke-width="2"/>
<text x="88" y="810" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#66716C" text-anchor="start">Answer shape</text>
<text x="88" y="843" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#26302F" text-anchor="start">ID + distribution</text>
<text x="88" y="875" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#26302F" text-anchor="start">+ confidence</text>
<text x="88" y="930" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66716C" text-anchor="start">Code: pick a queue</text>
<rect x="552" y="430" width="108" height="34" rx="17" fill="#FFF0E8"/>
<text x="606.0" y="453" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#E47254" text-anchor="middle">SCORE</text>
<text x="552" y="505" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#26302F" text-anchor="start">Where on the scale?</text>
<text x="552" y="550" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#26302F" text-anchor="start">How much does this</text>
<text x="552" y="583" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#26302F" text-anchor="start">block the task?</text>
<line x1="573" y1="623" x2="901" y2="623" stroke="#26302F" stroke-width="3"/>
<circle cx="573" cy="623" r="6" fill="#E47254"/>
<text x="573" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#26302F" text-anchor="middle">0</text>
<circle cx="737" cy="623" r="6" fill="#E47254"/>
<text x="737" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#26302F" text-anchor="middle">1</text>
<circle cx="901" cy="623" r="6" fill="#E47254"/>
<text x="901" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#26302F" text-anchor="middle">2</text>
<text x="552" y="694" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">0  Cosmetic defect</text>
<text x="552" y="725" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">1  Broken, workaround exists</text>
<text x="552" y="756" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">2  Blocked, no workaround</text>
<line x1="552" y1="773" x2="928" y2="773" stroke="#D8DCD4" stroke-width="2"/>
<text x="552" y="810" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#66716C" text-anchor="start">Answer shape</text>
<text x="552" y="843" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#26302F" text-anchor="start">A value between levels</text>
<text x="552" y="875" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#26302F" text-anchor="start">+ distribution + confidence</text>
<text x="552" y="930" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#66716C" text-anchor="start">Code: sort by impact</text>
<rect x="1016" y="430" width="108" height="34" rx="17" fill="#FFF0E8"/>
<text x="1070.0" y="453" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#E47254" text-anchor="middle">NOUL</text>
<text x="1016" y="505" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#26302F" text-anchor="start">Is the statement true?</text>
<text x="1016" y="550" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#26302F" text-anchor="start">Does the message state</text>
<text x="1016" y="583" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#26302F" text-anchor="start">a working workaround?</text>
<line x1="1037" y1="623" x2="1365" y2="623" stroke="#26302F" stroke-width="3"/>
<circle cx="1037" cy="623" r="6" fill="#FBF8F2" stroke="#26302F" stroke-width="2"/>
<text x="1037" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#26302F" text-anchor="middle">0</text>
<circle cx="1201" cy="623" r="6" fill="#FBF8F2" stroke="#26302F" stroke-width="2"/>
<text x="1201" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#26302F" text-anchor="middle">0.5</text>
<circle cx="1365" cy="623" r="6" fill="#FBF8F2" stroke="#26302F" stroke-width="2"/>
<text x="1365" y="656" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#26302F" text-anchor="middle">1</text>
<text x="1037" y="690" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#66716C" text-anchor="middle">no</text>
<text x="1365" y="690" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#66716C" text-anchor="middle">yes</text>
<text x="1201" y="734" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#66716C" text-anchor="middle">0.5 ≈ uncertainty</text>
<line x1="1016" y1="773" x2="1392" y2="773" stroke="#D8DCD4" stroke-width="2"/>
<text x="1016" y="810" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#66716C" text-anchor="start">Answer shape</text>
<text x="1016" y="843" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#26302F" text-anchor="start">Probability of yes: 0…1</text>
<text x="1016" y="875" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#26302F" text-anchor="start">No separate confidence</text>
<text x="1016" y="930" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#66716C" text-anchor="start">Code: decide whether to ask</text>
<text x="64" y="1025" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#26302F" text-anchor="start">The questions in one request are independent. The application code combines the answers.</text>
</svg>