<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="800" viewBox="0 0 1480 800" role="img" aria-labelledby="title desc">
<title id="title">Что построено на том же вызове</title>
<desc id="desc">Шесть разных продуктов на одной форме обращения. Общее в них одно: набор вариантов строит программа, а модель выбирает из закрытого набора.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#66716C"/></marker></defs>
<rect x="0" y="0" width="1480" height="800" rx="0" fill="#FBF8F2"/>
<text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#66716C" text-anchor="start">07  /  ПРИМЕНЕНИЯ</text>
<text x="64" y="126" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#26302F" text-anchor="start">Одна форма вызова, разные продукты</text>
<text x="64" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#66716C" text-anchor="start">Варианты строит программа. Модель выбирает из закрытого набора и возвращает распределение.</text>
<rect x="64" y="240" width="428" height="232" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="88" y="302" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Браузерный агент</text>
<text x="88" y="348" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#66716C" text-anchor="start">вход: DOM → таблица действий</text>
<line x1="88" y1="374" x2="468" y2="374" stroke="#D8DCD4" stroke-width="2"/>
<text x="88" y="416" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">Choice выбирает номер</text>
<rect x="516" y="240" width="428" height="232" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="540" y="302" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Компактизация</text>
<text x="540" y="348" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#66716C" text-anchor="start">вход: вызов инструмента</text>
<line x1="540" y1="374" x2="920" y2="374" stroke="#D8DCD4" stroke-width="2"/>
<text x="540" y="416" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">два Noul: нужен ли вызов и нужен л</text>
<text x="540" y="446" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">и вывод</text>
<rect x="968" y="240" width="428" height="232" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="992" y="302" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Маршрутизация</text>
<text x="992" y="348" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#66716C" text-anchor="start">вход: признаки задачи</text>
<line x1="992" y1="374" x2="1372" y2="374" stroke="#D8DCD4" stroke-width="2"/>
<text x="992" y="416" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">три независимых Choice в одном зап</text>
<text x="992" y="446" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">росе</text>
<rect x="64" y="508" width="428" height="232" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="88" y="570" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Обход графа</text>
<text x="88" y="616" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#66716C" text-anchor="start">вход: кандидаты-рёбра</text>
<line x1="88" y1="642" x2="468" y2="642" stroke="#D8DCD4" stroke-width="2"/>
<text x="88" y="684" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">распределение как оценки гипотез</text>
<rect x="516" y="508" width="428" height="232" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="540" y="570" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Триаж ревью</text>
<text x="540" y="616" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#66716C" text-anchor="start">вход: файл × измерение</text>
<line x1="540" y1="642" x2="920" y2="642" stroke="#D8DCD4" stroke-width="2"/>
<text x="540" y="684" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">пять Noul за один round-trip</text>
<rect x="968" y="508" width="428" height="232" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="992" y="570" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Верификация</text>
<text x="992" y="616" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#66716C" text-anchor="start">вход: текст ответа</text>
<line x1="992" y1="642" x2="1372" y2="642" stroke="#D8DCD4" stroke-width="2"/>
<text x="992" y="684" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#26302F" text-anchor="start">Noul об узком факте, не о качестве</text>
</svg>