<svg xmlns="http://www.w3.org/2000/svg" width="1468" height="644" viewBox="0 0 1468 644" role="img" aria-labelledby="title desc">
<title id="title">jev · one run</title>
<desc id="desc">An offline demonstration: a requirement is unverified, the mandatory check C2 fails, a prepared router answer picks diagnostic D2, the worker repairs the code, a new snapshot is taken, both checks pass and the policy ends the run.</desc>
