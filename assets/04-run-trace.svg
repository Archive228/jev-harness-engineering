<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1290" viewBox="0 0 1480 1290" role="img" aria-labelledby="title desc">
<title id="title">Трасса демонстрационного запуска</title>
<desc id="desc">Явно офлайн-сценарий: требование поиска по описанию сначала не подтверждено. Обязательная проверка C2 выявляет ошибку. Подготовленный ответ router выбирает диагностическую проверку D2. Worker исправляет реализацию, создаётся новый snapshot, оба обязательных теста проходят, программная политика завершает запуск. Схема не показывает результаты живого API Jev.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4.5 L0,9" fill="#66716C"/></marker></defs>
<rect x="0" y="0" width="1480" height="1290" rx="0" fill="#FBF8F2"/>
<text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#66716C" text-anchor="start">04  /  РАЗБОР ОДНОГО ЗАПУСКА</text>
<text x="64" y="126" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#26302F" text-anchor="start">От «не проверено» до подтверждённого результата</text>
<text x="64" y="172" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#66716C" text-anchor="start">Офлайн-demo: ответы judge и действие worker подготовлены. Живой API Jev здесь не вызывается.</text>
<line x1="98" y1="274" x2="98" y2="1120" stroke="#D8DCD4" stroke-width="3"/>
<circle cx="98" cy="275" r="26" fill="#FFF0E8" stroke="#E47254" stroke-width="2"/>
<text x="98" y="283" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#26302F" text-anchor="middle">01</text>
<rect x="153" y="220" width="1263" height="132" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="181" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#66716C" text-anchor="start">СВИДЕТЕЛЬСТВА</text>
<text x="181" y="287" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">R2: поиск по описанию</text>
<text x="181" y="327" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#66716C" text-anchor="start">Есть заявление worker; актуального результата C2 ещё нет.</text>
<rect x="1187" y="263" width="205" height="34" rx="17" fill="#F1F2EC"/>
<text x="1289.5" y="286" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#26302F" text-anchor="middle">UNVERIFIED</text>
<circle cx="98" cy="433" r="26" fill="#FFF0E8" stroke="#E47254" stroke-width="2"/>
<text x="98" y="441" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#26302F" text-anchor="middle">02</text>
<rect x="153" y="378" width="1263" height="132" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="181" y="408" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#66716C" text-anchor="start">ОБЯЗАТЕЛЬНЫЙ ТЕСТ</text>
<text x="181" y="445" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Код запускает C2</text>
<text x="181" y="485" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#66716C" text-anchor="start">Поиск по описанию не находит задачу. Появился факт сбоя.</text>
<rect x="1187" y="421" width="205" height="34" rx="17" fill="#F1F2EC"/>
<text x="1289.5" y="444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#26302F" text-anchor="middle">FAIL</text>
<circle cx="98" cy="591" r="26" fill="#FFF0E8" stroke="#E47254" stroke-width="2"/>
<text x="98" y="599" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#26302F" text-anchor="middle">03</text>
<rect x="153" y="536" width="1263" height="132" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="181" y="566" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#66716C" text-anchor="start">ДОП. ДИАГНОСТИКА</text>
<text x="181" y="603" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Демонстрационный router → D2</text>
<text x="181" y="643" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#66716C" text-anchor="start">Проверка запроса: используется только поле title.</text>
<rect x="1187" y="579" width="205" height="34" rx="17" fill="#FFF0E8"/>
<text x="1289.5" y="602" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E47254" text-anchor="middle">НОВЫЙ ФАКТ</text>
<circle cx="98" cy="749" r="26" fill="#FFF0E8" stroke="#E47254" stroke-width="2"/>
<text x="98" y="757" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#26302F" text-anchor="middle">04</text>
<rect x="153" y="694" width="1263" height="132" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="181" y="724" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#66716C" text-anchor="start">ИСПРАВЛЕНИЕ</text>
<text x="181" y="761" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Worker обновляет реализацию</text>
<text x="181" y="801" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#66716C" text-anchor="start">Поиск учитывает title ИЛИ description.</text>
<rect x="1187" y="737" width="205" height="34" rx="17" fill="#F1F2EC"/>
<text x="1289.5" y="760" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#26302F" text-anchor="middle">НОВЫЙ КОД</text>
<circle cx="98" cy="907" r="26" fill="#FFF0E8" stroke="#E47254" stroke-width="2"/>
<text x="98" y="915" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#26302F" text-anchor="middle">05</text>
<rect x="153" y="852" width="1263" height="132" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="181" y="882" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#66716C" text-anchor="start">ПОВТОРНАЯ ПРОВЕРКА</text>
<text x="181" y="919" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Новый snapshot → C1 и C2</text>
<text x="181" y="959" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#66716C" text-anchor="start">Результаты прежней версии не подтверждают текущий код.</text>
<rect x="1187" y="895" width="205" height="34" rx="17" fill="#F1F2EC"/>
<text x="1289.5" y="918" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#26302F" text-anchor="middle">PASS + PASS</text>
<circle cx="98" cy="1065" r="26" fill="#FFF0E8" stroke="#E47254" stroke-width="2"/>
<text x="98" y="1073" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#26302F" text-anchor="middle">06</text>
<rect x="153" y="1010" width="1263" height="132" rx="20" fill="#FFFFFF" stroke="#D8DCD4" stroke-width="1.5"/>
<text x="181" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#66716C" text-anchor="start">ПРАВИЛО ЗАВЕРШЕНИЯ</text>
<text x="181" y="1077" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#26302F" text-anchor="start">Все обязательные условия выполнены</text>
<text x="181" y="1117" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#66716C" text-anchor="start">Программа сохраняет отчёт и останавливает цикл.</text>
<rect x="1187" y="1053" width="205" height="34" rx="17" fill="#FFF0E8"/>
<text x="1289.5" y="1076" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E47254" text-anchor="middle">COMPLETE</text>
<rect x="64" y="1208" width="1352" height="48" rx="12" fill="#FFF0E8"/>
<text x="88" y="1239" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#26302F" text-anchor="start">Нет результата ≠ провал. PASS старой версии ≠ PASS текущей. Решение Jev ≠ результат команды.</text>
</svg>